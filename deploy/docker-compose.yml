# Produkční nasazení projektu aracze na server (IONOS VPS).
# Obrazy se NEbuildují zde — stahují se hotové z GitHub Container Registry
# (ghcr.io), sestavené v GitHub Actions. Server je jen spouští.
#
# Umístění na serveru: /opt/aracze/docker-compose.yml (+ /opt/aracze/.env)
# Nasazení: docker compose pull && docker compose up -d

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Debian (glibc) + ICU cs-CZ collation (české řazení). Uplatní se jen při initdb
      # na čerstvém volume. Migrace z Alpine proběhla přes dump/restore (2026-07-19).
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=cs-CZ --locale=en_US.utf8'
    volumes:
      # PostgreSQL 18+ image ukládá data do podadresáře; mount patří na
      # /var/lib/postgresql (ne /…/data jako u <=17). Nový volume pgdata_debian —
      # starý pgdata (Alpine/musl) zůstal na serveru jako rollback (smazat po ověření).
      - pgdata_debian:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Databáze není vystavená ven — přístup jen z ostatních kontejnerů.

  cms:
    image: ghcr.io/aracze/aracze:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Cloudflare R2 (S3-kompatibilní) – ZÁLOHA médií. Cloudinary zůstává hlavní
      # úložiště; hook v Media.ts po nahrání zkopíruje obrázek i do R2. Bez těchto
      # proměnných záloha spadne (r2BackupStatus='error'). Hodnoty do /opt/aracze/.env.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET: ${S3_SECRET}
      # NEXT_PUBLIC_* (vč. base URL pro absolutní adresy obrázků) se do image
      # zapékají při buildu (viz cd.yml), za běhu tu proto nejsou.
      # SMTP (odesílání e-mailů z administrace – reset hesla). Běhové proměnné,
      # ne build-time – hodnoty doplň do /opt/aracze/.env. Bez SMTP_HOST se
      # e-maily jen vypíšou do logu (žádné odesílání).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      # Google Analytics 4 Data API – noční sync návštěvnosti (/api/sync-analytics).
      # Hodnoty doplň do /opt/aracze/.env.
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID}
      GA4_SERVICE_ACCOUNT_JSON: ${GA4_SERVICE_ACCOUNT_JSON}
      ANALYTICS_SYNC_SECRET: ${ANALYTICS_SYNC_SECRET}
      # Kiwi Tequila Search API – denní sync akčních nabídek
      # (/api/sync-affiliate-deals). Bez tohoto řádku se hodnota z /opt/aracze/.env
      # do kontejneru NEDOSTANE (compose proměnné vyjmenovává) a sync tiše
      # vynechá letenky — ověřeno při nasazení 14. 8. 2026.
      KIWI_TEQUILA_API_KEY: ${KIWI_TEQUILA_API_KEY}
      # Feedy zájezdů (formát Sdovolená.cz) pro denní sync /api/sync-tour-offers —
      # SFTP přístup od každé cestovky zvlášť (zatím jen Čedok; Fischer, Exim,
      # TUI a Blue Style přibudou po schválení feedu u VIVnetworks, předpony
      # FISCHER_, EXIM_, TUI_, BLUESTYLE_). Stejná past jako u Kiwi: bez řádku
      # zde se hodnota z /opt/aracze/.env do kontejneru nedostane a zdroj se
      # v syncu tiše přeskočí.
      CEDOK_SFTP_HOST: ${CEDOK_SFTP_HOST}
      CEDOK_SFTP_USER: ${CEDOK_SFTP_USER}
      CEDOK_SFTP_PASSWORD: ${CEDOK_SFTP_PASSWORD}
      CEDOK_SFTP_PATH: ${CEDOK_SFTP_PATH}
      # TUI: veřejný https feed, jen adresa (`<PREFIX>_FEED_URL` má přednost před SFTP).
      TUI_FEED_URL: ${TUI_FEED_URL}
      # Fischer + Exim: produktový katalog CJ (GraphQL) — token a CID z /opt/aracze/.env,
      # zdroje se zapínají `<PREFIX>_FEED=cj`.
      CJ_API_TOKEN: ${CJ_API_TOKEN}
      CJ_COMPANY_ID: ${CJ_COMPANY_ID}
      FISCHER_FEED: ${FISCHER_FEED}
      EXIM_FEED: ${EXIM_FEED}
      # Počasí na stránkách Počasí: Meteostat (měsíční sync klimatických normálů
      # /api/sync-climate-normals) a OpenWeather One Call 3.0 (aktuální stav
      # a předpověď při renderu). Platí stejná past jako u Kiwi výš — bez těchto
      # řádků se klíče z /opt/aracze/.env do kontejneru nedostanou; normály by
      # se nestáhly a živé počasí by spadlo na bezplatné endpointy (6denní
      # předpověď), obojí bez hlášky.
      METEOSTAT_RAPIDAPI_KEY: ${METEOSTAT_RAPIDAPI_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      # Cloudflare Turnstile (ochrana registrace/obnovy hesla a komentářů proti
      # robotům) — bez obou klíčů se v aplikaci tiše vypne a jede jen honeypot.
      # Hodnoty do /opt/aracze/.env; widget má v CF povolené hostnames ara.cz.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    # Bez `ports` — appka je dostupná jen uvnitř docker sítě, zvenčí výhradně
    # přes Caddy. Kdyby port zůstal otevřený, dal by se origin obejít přes
    # holé http a minout tím TLS i Cloudflare.

  # Reverzní proxy, která ukončuje TLS certifikátem Cloudflare Origin CA
  # (/opt/aracze/certs, platnost do 2041, neobnovuje se). Díky ní může být
  # v Cloudflare režim Full (strict) — ten na rozdíl od Full certifikát
  # skutečně ověřuje. Konfigurace: deploy/Caddyfile → /opt/aracze/Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - cms
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata: # starý Alpine/musl volume — ponechán jako rollback po migraci, smazat po ověření
  pgdata_debian:
  caddy_data:
  caddy_config:
